[project]
name = "internship_course"
version = "0.1.0"
description = "Curriculum and reference implementation for an 8-week modern agentic AI application development course."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0,<3.0",
    "fastapi[standard]>=0.115,<1.0",
    "logfire[fastapi]>=3.8,<5.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.8,<3.0",
    "pydantic-ai[groq]>=2.0.0",
    "pydantic-ai-harness>=0.3.0,<0.4.0",
    "pydantic-settings>=2.4,<3.0",
    "pyjwt>=2.9,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "subagents-pydantic-ai>=0.2.9",
    "fastmcp-slim[server]>=3.4.4",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=25.1.0",
    "chonkie>=1.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11,<0.12",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
